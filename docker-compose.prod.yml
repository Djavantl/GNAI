services:
  app:
    image: gnai-php:prod
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/opcache.prod.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./docker/php/timezone.ini:/usr/local/etc/php/conf.d/timezone.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    command: sh /var/www/docker/php/entrypoint.sh app
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp = @fsockopen(\"127.0.0.1\", 9000); if ($$fp) { fclose($$fp); exit(0); } exit(1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - backend

  scheduler:
    image: gnai-php:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    command: sh /var/www/docker/php/entrypoint.sh scheduler
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 64M
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - backend

  queue:
    image: gnai-php:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    command: sh /var/www/docker/php/entrypoint.sh queue
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 128M
    networks:
      - backend

  db:
    image: mysql:8.0.46
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set. Run docker compose --env-file .env.prod -f docker-compose.prod.yml up -d}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set. Run docker compose --env-file .env.prod -f docker-compose.prod.yml up -d}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set. Run docker compose --env-file .env.prod -f docker-compose.prod.yml up -d}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set. Run docker compose --env-file .env.prod -f docker-compose.prod.yml up -d}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.prod.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 384M
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - backend
volumes:
  dbdata:

networks:
  backend:
    driver: bridge
